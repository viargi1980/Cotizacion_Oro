
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Predicción Oro IA</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {

    font-family: Segoe UI, Arial, sans-serif;

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #1e293b,
        #111827
    );

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 100vh;

    color: white;

    padding: 20px;
}

.card {

    width: 900px;

    background: rgba(
        31,
        41,
        55,
        0.95
    );

    border-radius: 25px;

    padding: 40px;

    box-shadow:
        0 0 50px rgba(
            0,
            0,
            0,
            0.5
        );

    text-align: center;
}

.header h1 {

    color: gold;

    font-size: 42px;

    margin-bottom: 10px;
}

.subtitle {

    color: #cbd5e1;

    font-size: 18px;
}

.grid {

    display: flex;

    justify-content: center;

    gap: 30px;

    margin-top: 30px;

    flex-wrap: wrap;
}

.box {

    background: #111827;

    border-radius: 20px;

    padding: 25px;

    min-width: 220px;

    box-shadow:
        0 0 15px rgba(
            255,
            255,
            255,
            0.05
        );
}

.label {

    color: #94a3b8;

    font-size: 14px;

    text-transform: uppercase;

    letter-spacing: 1px;
}

.value {

    margin-top: 10px;

    font-size: 30px;

    font-weight: bold;
}

.circle {

    width: 260px;

    height: 260px;

    border-radius: 50%;

    background:
        conic-gradient(
            #ef4444 3.1513881047309713%,
            #374151 0
        );

    display: flex;

    justify-content: center;

    align-items: center;

    margin: 35px auto;
}

.circle-inner {

    width: 195px;

    height: 195px;

    border-radius: 50%;

    background: #111827;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;
}

.circle-label {

    color: #94a3b8;

    font-size: 14px;

    margin-bottom: 6px;
}

.circle-value {

    font-size: 42px;

    font-weight: bold;
}

.signal {

    margin-top: 20px;

    font-size: 34px;

    font-weight: bold;

    color: #ef4444;
}

.progress-container {

    background: #374151;

    height: 35px;

    border-radius: 20px;

    overflow: hidden;

    margin-top: 30px;
}

.progress-bar {

    height: 35px;

    width: 3.15%;

    background: #ef4444;
}

.stats {

    margin-top: 25px;

    font-size: 22px;
}

.footer {

    margin-top: 35px;

    padding-top: 20px;

    border-top: 1px solid #374151;

    color: #94a3b8;

    font-size: 15px;
}

.footer strong {
    color: white;
}

</style>

</head>

<body>

<div class="card">

    <div class="header">

        <h1>📈 Predicción Oro IA</h1>

        <div class="subtitle">
            Análisis automático mediante Machine Learning
        </div>

    </div>

    <div class="grid">

        <div class="box">

            <div class="label">
                Fecha Mercado
            </div>

            <div class="value">
                2026-10-28
            </div>

        </div>

        <div class="box">

            <div class="label">
                Precio Oro
            </div>

            <div class="value">
                $4068.2
            </div>

        </div>

    </div>

    <div class="circle">

        <div class="circle-inner">

            <div class="circle-label">
                Probabilidad
            </div>

            <div class="circle-value">
                3.15%
            </div>

        </div>

    </div>

    <div class="signal">
        🔴 NO COMPRAR 🔴
    </div>

    <div class="progress-container">
        <div class="progress-bar"></div>
    </div>

    <div class="stats">
        Predicción del modelo:
        <strong>0</strong>
    </div>

    <div class="footer">

        Última actualización de la web:
        <strong>28/10/2026 13:16</strong>

    </div>

</div>

</body>

</html>
