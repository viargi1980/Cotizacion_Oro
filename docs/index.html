
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Predicción Oro IA</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {

    font-family: Segoe UI, Arial, sans-serif;

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #1e293b,
        #111827
    );

    display: flex;

    justify-content: center;

    align-items: center;

    min-height: 100vh;

    color: white;
}

.card {

    width: 900px;

    background: rgba(
        31,
        41,
        55,
        0.95
    );

    border-radius: 25px;

    padding: 40px;

    box-shadow:
    0 0 50px rgba(
        0,
        0,
        0,
        0.5
    );

    text-align: center;
}

.header {

    margin-bottom: 30px;
}

.header h1 {

    color: gold;

    font-size: 42px;
}

.subtitle {

    color: #cbd5e1;

    margin-top: 10px;
}

.grid {

    display: flex;

    justify-content: center;

    gap: 30px;

    margin-top: 30px;

    flex-wrap: wrap;
}

.box {

    background: #111827;

    border-radius: 20px;

    padding: 25px;

    min-width: 220px;
}

.label {

    color: #94a3b8;

    font-size: 14px;

    text-transform: uppercase;
}

.value {

    margin-top: 10px;

    font-size: 32px;

    font-weight: bold;
}

.circle {

    width: 250px;

    height: 250px;

    border-radius: 50%;

    background:
        conic-gradient(
            #ef4444 3.1513881047309713%,
            #374151 0
        );

    display: flex;

    justify-content: center;

    align-items: center;

    margin: 30px auto;
}

.circle-inner {

    width: 190px;

    height: 190px;

    border-radius: 50%;

    background: #111827;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 42px;

    font-weight: bold;
}

.signal {

    margin-top: 20px;

    font-size: 34px;

    font-weight: bold;

    color: #ef4444;
}

.progress-container {

    background: #374151;

    height: 35px;

    border-radius: 20px;

    overflow: hidden;

    margin-top: 30px;
}

.progress-bar {

    height: 35px;

    width: 3.15%;

    background: #ef4444;

    transition: width 1s ease;
}

.footer {

    margin-top: 30px;

    color: #94a3b8;
}

</style>

</head>

<body>

<div class="card">

<div class="header">

<h1>📈 Predicción Oro IA</h1>

</div>

<div class="grid">

<div class="box">

<div class="label">
Fecha
</div>

<div class="value">
2026-10-28
</div>

</div>

<div class="box">

<div class="label">
Precio Oro
</div>

<div class="value">
$4059.7
</div>

</div>

</div>

<div class="circle">

<div class="circle-inner">

3.15%

</div>

</div>

<div class="signal">

🔴 NO COMPRAR 🔴

</div>

<div class="progress-container">

<div class="progress-bar"></div>

</div>

</div>

</body>

</html>
