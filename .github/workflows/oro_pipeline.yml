name: Actualizar Web Oro

on:
  schedule:
    - cron: "0 6 */2 * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  actualizar:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pipeline
        run: |
          python pipe.py

      - name: Commit y Push
        run: |
          git config user.name "viargi1980"
          git config user.email "viargi1980@gmail.com"

          git add .

          git diff --staged --quiet || git commit -m "Actualizacion automatica"

          git push